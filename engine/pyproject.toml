[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stale-engine"
version = "2.0.0"
description = "Stale: deterministic re-verification of expired safety claims"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "httpx>=0.27",
  "cryptography>=43",
  "pglast>=7",
  "psycopg[binary]>=3.2",
  "rfc8785>=0.1.4",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30", "pytest-cov>=5"]

[project.scripts]
stale = "stale_engine.cli:app"

[tool.setuptools.packages.find]
include = ["stale_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs a live PostgreSQL (STALE_TEST_DATABASE_URL)"]
